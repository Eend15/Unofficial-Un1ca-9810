name: "✨ Feature or design idea / 기능·디자인 제안"
description: A new feature, a different look or a better feel / 새 기능, 다른 디자인, 더 나은 느낌
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please describe one idea per issue. / 아이디어를 환영합니다. 이슈 하나에 아이디어 하나씩 적어 주세요.
  - type: dropdown
    id: area
    attributes:
      label: What is it about / 무엇에 대한 건가요
      options:
        - Look of a card or the pill / 카드·알약 모양
        - Animation or feel / 애니메이션·느낌
        - Music player / 음악 플레이어
        - Flashlight and quick toggles / 손전등·빠른 설정
        - Settings / 설정
        - A new kind of card / 새로운 종류의 카드
        - Something else / 그 밖
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like / 원하는 것
      description: What should change, and why it would be better. A switch in the settings is fine too. / 무엇이 바뀌었으면 하는지, 왜 더 좋은지. 설정의 스위치도 좋습니다.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Pictures or references / 그림·참고 자료
      description: A screenshot, a mock-up or a link to what you mean (another app or module). / 말씀하신 것의 스크린샷, 목업, 링크(다른 앱이나 모듈)
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending / 보내기 전에
      options:
        - label: I looked through the open issues and did not find the same idea. / 열린 이슈에서 같은 제안이 없는 것을 확인했습니다.
          required: true
