name: Label new issues for triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-triage-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add needs triage label when no status is set
        uses: actions/github-script@v7
        with:
          script: |
            const statusLabels = ['needs triage', 'needs info', 'planned', 'in progress', 'in testing'];
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            if (issue.labels.some(label => statusLabels.includes(label.name))) {
              core.info('Issue already has a status label; skipping.');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs triage']
            });
