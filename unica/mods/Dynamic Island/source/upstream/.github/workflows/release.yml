name: Release

# Builds, tests, signs and publishes the APK as a GitHub release, either when a tag such as v0.1.1 is pushed (the tag
# must match versionName in app/build.gradle) or when the workflow is started by hand from the branch to release (the
# tag v<versionName> is then created on that commit). The signing key lives in repository secrets, so every release
# carries the same signature and installs as an update over the previous one. See docs/DEVELOPMENT.md ("Releases").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Work out the version and tag
        run: |
          version="$(grep -m1 versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the repository secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (see docs/DEVELOPMENT.md)." >&2
            exit 1
          fi
          mkdir -p release-keys
          echo "$KEYSTORE_BASE64" | base64 -d > release-keys/release.jks
          scripts/sign.sh release-keys/release.jks "${KEYSTORE_ALIAS:-dynamicisland}"
          rm -f release-keys/release.jks

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="release/DynamicIsland-${VERSION}.apk"
          sha256sum "$apk" | tee "$apk.sha256"
          # notes come from docs/release-notes/<version>.md when it exists, else they are generated from the commits
          notes_file="docs/release-notes/${VERSION}.md"
          # a version with a suffix (0.1.6-dev2) is published as a pre-release
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
            gh release edit "$TAG" --title "Dynamic Island ${VERSION}" $pre
            if [ -f "$notes_file" ]; then
              gh release edit "$TAG" --notes-file "$notes_file"
            fi
          elif [ -f "$notes_file" ]; then
            gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Dynamic Island ${VERSION}" --notes-file "$notes_file" $pre
          else
            gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Dynamic Island ${VERSION}" --generate-notes $pre
          fi
