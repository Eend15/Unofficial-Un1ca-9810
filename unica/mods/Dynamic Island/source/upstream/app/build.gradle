plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.android.dynamicisland'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.android.dynamicisland'
        minSdk 35
        targetSdk 36
        versionCode 87
        versionName '0.1.13'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // offline Robolectric: run with -ProbolectricDir=<folder with android-all-instrumented jars>
                if (project.hasProperty('robolectricDir')) {
                    systemProperty 'robolectric.offline', 'true'
                    systemProperty 'robolectric.dependency.dir', project.property('robolectricDir')
                }
                // Visual review captures are opt-in; pixel/layout regressions still run normally.
                if (project.hasProperty('render')) {
                    systemProperty 'render', 'true'
                } else {
                    useJUnit {
                        excludeCategories 'dev.android.dynamicisland.testutil.RenderCapture'
                    }
                }
            }
            returnDefaultValues = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Hidden framework API signatures only; never add these sources to an Android source set.
// Keep android.jar on the ordinary classpath: javac 17 rejects -bootclasspath with target 17.
def compileCompositionSamplingStubs = tasks.register('compileCompositionSamplingStubs', JavaCompile) {
    source rootProject.file('tools/framework-stubs/android/view/CompositionSamplingListener.java')
    classpath = files(providers.provider { android.bootClasspath })
    sourceCompatibility = android.compileOptions.sourceCompatibility.toString()
    targetCompatibility = android.compileOptions.targetCompatibility.toString()
    destinationDirectory.set(layout.buildDirectory.dir('generated/stubs/composition-sampling/classes'))
    options.encoding = 'UTF-8'
}

def compositionSamplingStubsJar = tasks.register('compositionSamplingStubsJar', Jar) {
    from(compileCompositionSamplingStubs.flatMap { it.destinationDirectory })
    destinationDirectory.set(layout.buildDirectory.dir('generated/stubs/composition-sampling'))
    archiveFileName.set('composition-sampling-stubs.jar')
}

dependencies {
    compileOnly files(compositionSamplingStubsJar.flatMap { it.archiveFile })
            .builtBy(compositionSamplingStubsJar)
    compileOnly files('libs/xposed-api-82.jar')

    testImplementation files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

apply from: rootProject.file('gradle/localization.gradle')
